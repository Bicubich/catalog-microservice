version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: catalog_user
      POSTGRES_PASSWORD: catalog_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog_user -d catalog_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DB_URL: postgresql+asyncpg://catalog_user:catalog_password@postgres:5432/catalog_db
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadminpassword
      MINIO_BUCKET: catalog-images
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  bot:
    build: ./bot
    environment:
      BOT_TOKEN: "YOUR_TELEGRAM_BOT_TOKEN"
      ADMIN_ID: "YOUR_TELEGRAM_ADMIN_ID"
      BACKEND_URL: "http://backend:8000"
      WEBAPP_URL: "https://your-domain-or-ngrok.ngrok-free.app"
    depends_on:
      - backend

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
    depends_on:
      - backend

volumes:
  pgdata:
  miniodata:
